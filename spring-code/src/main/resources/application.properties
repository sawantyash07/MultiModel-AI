server.port=8080
spring.application.name=yash-ai-platform

# ==============================================================================
# Configurable AI Provider Architecture (Gemini Free Hosted / Local Ollama / HF)
# ==============================================================================
ai.provider.active=${AI_PROVIDER:gemini}
ai.provider.default-model=${AI_DEFAULT_MODEL:gemini-2.5-flash}

# Google Gemini (Free-Tier Hosted Inference Provider)
gemini.api-key=${GEMINI_API_KEY:}
gemini.endpoint=${GEMINI_ENDPOINT:https://generativelanguage.googleapis.com/v1beta/openai/chat/completions}

# Groq (Free-Tier High-Speed Hosted Inference Provider)
groq.api-key=${GROQ_API_KEY:}
groq.endpoint=${GROQ_ENDPOINT:https://api.groq.com/openai/v1/chat/completions}
groq.default-model=${GROQ_DEFAULT_MODEL:qwen/qwen3.8-27b}
groq.fallback-enabled=${GROQ_FALLBACK_ENABLED:true}

# Local Ollama (Zero-Cost Private Local Inference Provider)
ollama.endpoint=${OLLAMA_ENDPOINT:http://localhost:11434/v1/chat/completions}
ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}

# Hugging Face Inference Providers (Paid Credits Required on Hosted Router)
huggingface.token=${HF_TOKEN:}
huggingface.endpoint=${HF_ENDPOINT:https://router.huggingface.co/featherless-ai/v1/chat/completions}
huggingface.model=${HF_MODEL:Qwen/Qwen2.5-7B-Instruct}
huggingface.provider=${HF_PROVIDER:featherless-ai}

# Pinecone Vector Store Configuration
pinecone.api-key=${PINECONE_API_KEY:}
pinecone.index-name=${PINECONE_INDEX:shop-support}

# Spring AI Gemini Integration (OpenAI-compatible endpoints)
spring.ai.openai.chat.api-key=${GEMINI_API_KEY:}
spring.ai.openai.chat.base-url=https://generativelanguage.googleapis.com/v1beta/openai
spring.ai.openai.chat.options.model=gemini-2.5-flash

# Spring AI Pinecone Vector Store
spring.ai.vectorstore.pinecone.api-key=${PINECONE_API_KEY:}
spring.ai.vectorstore.pinecone.index-name=${PINECONE_INDEX:shop-support}
spring.ai.vectorstore.pinecone.namespace=policies

# Transformers Local ONNX Embedding Model
spring.ai.embedding.transformer.tokenizer.uri=classpath:models/all-MiniLM-L6-v2/tokenizer.json
spring.ai.embedding.transformer.onnx.model-uri=classpath:models/all-MiniLM-L6-v2/model.onnx
spring.ai.embedding.transformer.cache.enabled=false

# MCP Server
spring.ai.mcp.server.enabled=true
spring.ai.mcp.server.name=yash-ai-mcp-server
spring.ai.mcp.server.version=2.0.0

# Multipart File Upload Limits
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Web Resources
spring.web.resources.static-locations=classpath:/static/

# ==============================================================================
# Live Web Search & Verification Providers (Brave Search / Tavily / Serper / DDG)
# ==============================================================================
websearch.enabled=${WEB_SEARCH_ENABLED:true}
websearch.mode=${WEB_SEARCH_MODE:auto}
websearch.brave.api-key=${BRAVE_API_KEY:}
websearch.brave.endpoint=https://api.search.brave.com/res/v1/web/search
websearch.tavily.api-key=${TAVILY_API_KEY:}
websearch.tavily.endpoint=https://api.tavily.com/search
websearch.serper.api-key=${SERPER_API_KEY:}
websearch.cache.enabled=true

# ==============================================================================
# Speech Recognition / Automatic Speech Recognition (openai/whisper-large-v3)
# ==============================================================================
asr.enabled=${ASR_ENABLED:true}
asr.model-id=${ASR_MODEL_ID:openai/whisper-large-v3}
asr.hf-endpoint=https://router.huggingface.co/hf-inference/models/openai/whisper-large-v3
asr.timeout-seconds=30

# ==============================================================================
# Document Intelligence & RAG
# ==============================================================================
document.max-file-size=50MB
document.chunk-size=600
document.chunk-overlap=100
document.top-k=5

# ==============================================================================
# Multilingual Text-To-Speech (TTS) Configuration (Sarvam Bulbul / Bodhan / Google Hosted)
# ==============================================================================
tts.enabled=${TTS_ENABLED:true}
tts.model-id=${TTS_MODEL_ID:google/multilingual-tts}
tts.provider=${TTS_PROVIDER:google-hosted}
tts.endpoint=${TTS_ENDPOINT:https://translate.google.com/translate_tts}
tts.timeout-seconds=${TTS_TIMEOUT_SECONDS:20}
tts.cache.enabled=${TTS_CACHE_ENABLED:true}
tts.default-language=${TTS_DEFAULT_LANGUAGE:en}

# Sarvam AI Bulbul Neural TTS (Production-Grade Indian Languages API)
sarvam.api-key=${SARVAM_API_KEY:}
sarvam.endpoint=${SARVAM_ENDPOINT:https://api.sarvam.ai/text-to-speech}
sarvam.model-id=${SARVAM_MODEL_ID:bulbul:v4-flash}
sarvam.default-speaker=${SARVAM_DEFAULT_SPEAKER:shubh}
sarvam.enabled=${SARVAM_ENABLED:true}
sarvam.timeout-seconds=${SARVAM_TIMEOUT_SECONDS:25}

# Bodhan AI Indic-Speak (22 Indian Languages + English Open Model API / Dedicated Endpoint)
tts.bodhan.endpoint=${BODHAN_ENDPOINT:https://api.bodhan.ai/v1/audio/speech}
tts.bodhan.api-key=${BODHAN_API_KEY:}
tts.bodhan.model-id=${BODHAN_MODEL_ID:bodhan-ai/indic-speak}
tts.bodhan.enabled=${BODHAN_ENABLED:true}
tts.bodhan.timeout-seconds=${BODHAN_TIMEOUT_SECONDS:25}

# AI4Bharat Indic-Parler-TTS (Hugging Face Space - Disabled by default to prevent 30s timeouts if Space is down)
tts.indic-parler.enabled=${HF_INDIC_PARLER_ENABLED:false}
tts.indic-parler.endpoint=${HF_INDIC_PARLER_ENDPOINT:https://ai4bharat-indic-parler-tts.hf.space}
tts.indic-parler.timeout-seconds=${HF_INDIC_PARLER_TIMEOUT_SECONDS:15}
